<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Sneakhub presentation</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/black.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section data-background-video="assets/app-preview.mp4">
					<div style="background-color: rgba(0, 0, 0, .8); margin: 50px;"> 
						<h1>Sneakhub ecommerce-application</h1>
						<h3>by const team = new Team();</h3>
					</div>
				</section>
				<section>
					<h5>Team members</h5>
					<span>The main functions (but not the only ones)</span>
					<ul>
						<li>Anton - <i style="color: rgb(117, 249, 165);">scrum-master, team management</i></li>
						<li>Sergey - <i style="color: rgb(117, 249, 165);">setting up commercetools</i></li>
						<li>Artur - <i style="color: rgb(117, 249, 165);">design, UI</i></li>
					</ul>
				</section>
				<section>
					<h5>Communication</h5>
					<span style="display: flex; align-items: center; gap: 15px; justify-content: center;">
						<img src="assets/telegram.png" alt="telegram logo">
						Telegram
					</span>
					<span style="display: flex; align-items: center; gap: 15px; justify-content: center;">
						<img src="assets/google-meet.png" alt="google meet logo">
						Google Meet
					</span>
										<span style="display: flex; align-items: center; gap: 15px; justify-content: center;">
						<img src="assets/jira.png" alt="jira logo">
						Jira
					</span>
				</section>
				<section>
					<div style="display: flex; width: 800px;">
						<img src="assets/jira-preview.jpg" style="width: 550px; height: 400px; position: relative;" alt="jira preview">
						<img src="assets/telegram-preview.jpg" style="width: 550px; height: 400px; position: relative; top: 200px; left: -50px;"  alt="telegram preview">
					</div>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
	</body>
</html>
